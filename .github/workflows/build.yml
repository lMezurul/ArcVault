name: build

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    name: Windows x64
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Zig
        uses: mlugg/setup-zig@v2
        with:
          version: 0.17.1

      - name: Build
        run: .\build.bat

      - name: Upload binaries
        uses: actions/upload-artifact@v4
        with:
          name: arcvault-win64
          path: bin/*.exe
          if-no-files-found: error
