  <text x="96" y="27" font-family="Segoe UI, sans-serif" font-size="13" fill="#71717A">Windows PowerShell</text>
  <text x="1216" y="27" text-anchor="end" font-family="Cascadia Code, Consolas, monospace" font-size="12" fill="#52525B">ArcVault demo</text>
  <text x="24" y="112" font-family="Cascadia Code, Consolas, monospace" font-size="14" fill="#8A8A93">PS C:\demo&gt;</text>
  <text x="119" y="112" font-family="Cascadia Code, Consolas, monospace" font-size="14" fill="#F5F5F5">arcvault.exe --store vault.bin --mount .\mnt --watch demo-app.exe --launch &quot;demo-app.exe .\mnt\vault.bin&quot;</text>
  <text x="24" y="162" font-family="Cascadia Code, Consolas, monospace" font-size="14" fill="#FF8080">== ArcVault launcher ==</text>
