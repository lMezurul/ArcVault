  <text x="24" y="262" font-family="Cascadia Code, Consolas, monospace" font-size="14" fill="#7D8590">[fsp] mounted at C:\demo\mnt  (virtual file: \vault.bin, 4194304 bytes)</text>
  <text x="24" y="287" font-family="Cascadia Code, Consolas, monospace" font-size="14" fill="#3FB950">[guard] trusted process adopted: pid 25844  C:\demo\demo-app.exe</text>
